replicaCount: 2

image:
  repository: cloudnative-demo
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }

# Needs Prometheus Operator CRDs (installed by kube-prometheus-stack). Off for plain local runs.
serviceMonitor:
  enabled: false
  releaseLabel: monitoring   # must match the Helm release name of kube-prometheus-stack
