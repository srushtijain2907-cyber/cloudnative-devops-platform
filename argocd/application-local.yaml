apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srushtijain2907-cyber/cloudnative-devops-platform.git
    targetRevision: main
    path: helm/cloudnative-demo
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
