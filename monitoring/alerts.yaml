apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-demo-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: cloudnative-demo
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{pod=~"cloudnative-demo.*"}[10m]) > 3
          for: 2m
          labels: { severity: critical }
          annotations: { summary: "Pod {{ $labels.pod }} is crash looping" }
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[2m]))
              / sum(rate(http_requests_total[2m])) > 0.05
          for: 1m
          labels: { severity: warning }
          annotations: { summary: "More than 5% of requests are failing" }
        - alert: HighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{pod=~"cloudnative-demo.*"}[5m])) by (pod) > 0.4
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Pod {{ $labels.pod }} CPU is high" }
        - alert: ReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{deployment="cloudnative-demo"} > 0
          for: 2m
          labels: { severity: critical }
          annotations: { summary: "Deployment has unavailable replicas" }
