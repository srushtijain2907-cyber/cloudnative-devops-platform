apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnative-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnative-demo
  template:
    metadata:
      labels:
        app: cloudnative-demo
    spec:
      containers:
        - name: app
          image: cloudnative-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cloudnative-demo
spec:
  selector:
    app: cloudnative-demo
  ports:
    - port: 80
      targetPort: 8080
